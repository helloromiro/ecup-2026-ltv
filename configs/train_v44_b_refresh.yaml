name: v44_b_refresh
description: >
  Ensemble B recipe on the current feature pool - the other half of the
  refresh described in train_v43_a_refresh.yaml. Original hyperparameters,
  no top-N selection, just the newer features.

seeds: [42, 123, 7]
num_boost_round: 550

lgbm_params:
  objective: regression
  metric: rmse
  learning_rate: 0.06
  num_leaves: 127
  max_depth: 8
  min_data_in_leaf: 150
  feature_fraction: 0.75
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 6.0
  num_threads: 6
  verbosity: -1
