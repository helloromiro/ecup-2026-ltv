name: hv_thresh_b3_screen
description: >
  Screening run (2 seeds, not a candidate) for the high-value-underestimation
  hypothesis: same recipe as v3 (cfgB tuning + top-100 features) but with a
  flat sample-weight boost (3x) for training rows with target>=200,
  renormalized to mean 1, vs the smooth value_pow scheme tried in parallel.
  See experiments/highvalue_reweighting/notes.md.

seeds: [42, 123]
top_n_features: 100
num_boost_round: 550

sample_weight_scheme: threshold_boost
sample_weight_threshold: 200.0
sample_weight_boost: 3.0

lgbm_params:
  objective: regression
  metric: rmse
  learning_rate: 0.06
  num_leaves: 127
  max_depth: 8
  min_data_in_leaf: 150
  feature_fraction: 0.75
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 6.0
  num_threads: 4
  verbosity: -1
