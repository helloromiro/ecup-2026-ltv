name: v24_unused_columns
description: >
  v3 recipe (cfgB + top-100 selection + 5 seeds) on the feature set
  expanded with 6 previously-unused raw columns (search, cat activity
  flags; has_search_to_cart/ord, has_cat_to_cart/ord conversion flags) -
  see experiments/unused_columns/notes.md. Tests whether these add
  genuine signal via honest multi-fold (unlike holiday_affinity, this is
  fully backtestable - no calendar-specific limitation).

seeds: [42, 123, 7, 2024, 555]
top_n_features: 100
num_boost_round: 550

lgbm_params:
  objective: regression
  metric: rmse
  learning_rate: 0.06
  num_leaves: 127
  max_depth: 8
  min_data_in_leaf: 150
  feature_fraction: 0.75
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 6.0
  num_threads: 4
  verbosity: -1
