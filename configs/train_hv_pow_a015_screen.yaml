name: hv_pow_a015_screen
description: >
  Screening run (2 seeds, not a candidate) for the high-value-underestimation
  hypothesis: same recipe as v3 (cfgB tuning + top-100 features) but with
  training-time sample weight w=(1+target)^0.15, renormalized to mean 1, to
  counter the tail-compression bias identified in error analysis (v3 on
  fold_05: true>=200 users get RMSLE 2.13 vs 1.67 overall, median prediction
  well below median truth). See experiments/highvalue_reweighting/notes.md.

seeds: [42, 123]
top_n_features: 100
num_boost_round: 550

sample_weight_scheme: value_pow
sample_weight_alpha: 0.15

lgbm_params:
  objective: regression
  metric: rmse
  learning_rate: 0.06
  num_leaves: 127
  max_depth: 8
  min_data_in_leaf: 150
  feature_fraction: 0.75
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 6.0
  num_threads: 4
  verbosity: -1
