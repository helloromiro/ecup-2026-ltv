name: v11_low_lr_final
description: >
  Final push on the low-lr line (v8 -> v10): v10 (3 seeds, ceiling 3000)
  already beat the original v3 (1.6613 vs 1.6614) while still not
  converged (best_iteration hit the ceiling on all 3 seeds). This scales
  back up to the full 5-seed bag used everywhere else in the sweep and
  raises the ceiling further to let it actually plateau. Current best
  candidate for the final submission if it holds or improves on v10's CV
  score - see experiments/v11_low_lr_final/notes.md for the decision.

seeds: [42, 123, 7, 2024, 555]
top_n_features: 100
num_boost_round: 4500
early_stopping_rounds: 120

lgbm_params:
  objective: regression
  metric: rmse
  learning_rate: 0.03
  num_leaves: 127
  max_depth: 8
  min_data_in_leaf: 150
  feature_fraction: 0.75
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 6.0
  num_threads: 4
  verbosity: -1
