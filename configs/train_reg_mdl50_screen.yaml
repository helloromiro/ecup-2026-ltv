name: reg_mdl50_screen
description: >
  Regularization-cause screen for the high-value underestimation (see
  experiments/highvalue_reweighting/notes.md): tests whether shrinkage
  from min_data_in_leaf specifically drives the tail-compression bias, by
  loosening ONLY min_data_in_leaf (150 -> 50) vs the v3_screen_2seed
  baseline, holding every other hyperparameter fixed. 2 seeds, screening
  only - not a candidate.

seeds: [42, 123]
top_n_features: 100
num_boost_round: 550

lgbm_params:
  objective: regression
  metric: rmse
  learning_rate: 0.06
  num_leaves: 127
  max_depth: 8
  min_data_in_leaf: 50
  feature_fraction: 0.75
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 6.0
  num_threads: 4
  verbosity: -1
