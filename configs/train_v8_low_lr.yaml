name: v8_low_lr
description: >
  Slower learning rate (0.03 vs cfgB's 0.06) with a much higher round
  ceiling and early stopping to find the actual optimum - tests whether
  cfgB's rounds/lr combination was undertrained rather than well-tuned.
  Same top-100 selection and 5 seeds as v3 for a like-for-like comparison.

seeds: [42, 123, 7, 2024, 555]
top_n_features: 100
num_boost_round: 2000
early_stopping_rounds: 80

lgbm_params:
  objective: regression
  metric: rmse
  learning_rate: 0.03
  num_leaves: 127
  max_depth: 8
  min_data_in_leaf: 150
  feature_fraction: 0.75
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 6.0
  num_threads: 4
  verbosity: -1
