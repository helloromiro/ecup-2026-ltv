name: v43_a_refresh
description: >
  Ensemble A (= v2_seed_bagging) recipe, retrained on the CURRENT feature
  pool including the gap and channel/zero-row sets. The measured blend
  weights put 0.179 on this component and 0.179 on Ensemble B, so 36% of the
  blend is carried by models fitted before those features existed. Giving the
  weak components the same information as the strong one is not extra
  capacity - it is the same recipe on a better view of the data.

  Hyperparameters are Ensemble A's originals, untouched: the point is to
  isolate the feature refresh.

seeds: [42, 123, 7, 2024]
num_boost_round: 650

lgbm_params:
  objective: regression
  metric: rmse
  learning_rate: 0.08
  num_leaves: 63
  max_depth: 7
  min_data_in_leaf: 200
  feature_fraction: 0.7
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 6.0
  num_threads: 6
  verbosity: -1
